name: Sync Shopee Products

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync-shopee-catalog.mjs"
      - "src/lib/shopee.ts"
      - ".github/workflows/sync-shopee-products.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync from Shopee
        run: node scripts/sync-shopee-catalog.mjs

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/products.json
          if git diff --staged --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: sync Shopee product catalog"
            git push
          fi
